<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Text Customizer</title>
    <link rel="stylesheet" href="style.css">


    <style>
        body {
    font-family: Arial, sans-serif;
    margin: 50px;
}

.container {
    display: flex;
    gap: 15px;
}

textarea {
    padding: 10px;
    font-size: 14px;
    border: 3px solid black;
}



/* image ex : */
.container2 {
    text-align: center;
    background: white;
    padding: 20px;
    border-radius: 8px;
}

img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    border-radius: 0; 
    transition: 0.3s ; 
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

button {
    padding: 8px 15px;
    font-size: 14px;
    border: 1px solid #ccc;
    background-color: #fff;
    border-radius: 4px;
}

button:hover {
    background-color: #eee;
}
    </style>
</head>
<body>

    <div class="container">
        <!-- (Font Family) -->
        <select id="fontFamily" onchange="changeFontFamily()">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Fantasy">Fantasy</option>
        </select>

        <!-- (Font Size) -->
        <select id="fontSize" onchange="changeFontSize()">
            <option value="10px">10px</option>
            <option value="15px">15px</option>
            <option value="20px">25px</option>
        </select>

        <!-- Checkbox  -->
        <label><input type="checkbox" id="italicCheck" onclick="toggleItalic()"> Italic</label>
        <label><input type="checkbox" id="boldCheck" onclick="toggleBold()"> Bold</label>
        <label><input type="checkbox" id="underlineCheck" onclick="toggleUnderline()"> Underline</label>

        
        </div><br><br>
        <!-- box -->
        <textarea id="textBox" rows="4" cols="55">the quick brown fox over the lazy dog</textarea><br><br><br><br>



        <!-- image ex : -->
        <div class="container2">
        <h2>Change Image Shape</h2>
        
        <img id="myImage" src="https://i.pinimg.com/1200x/db/04/35/db0435b7be4b6bd92e94fb40e7df327b.jpg" alt="Sunset">

        <div class="buttons">
            <button onclick="makeCircle()">Make Circle</button>
            <button onclick="makeSquare()">Make Square</button>
        </div>
    </div>
    
    <script src="JSTASKS4.js"></script>
</body>
</html>
